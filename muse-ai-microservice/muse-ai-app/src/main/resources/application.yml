spring:
  session:
    timeout: 2592000
  application:
    name: muse-ai-app
  datasource:
    url: jdbc:mysql://106.54.215.151:3306/muse_ai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: 0
      host: 106.54.215.151
      port: 6380
      password: ${REDIS_PASSWORD}
      ttl: 3600
  cloud:
    nacos:
      discovery:
        server-addr: 106.54.215.151:8848
        namespace: 47f6fb31-1206-4a12-9dfb-e595de064aed
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.minimaxi.com/v1
      api-key: ${MUSE_MINIMAX_API_KEY}
      model-name: MiniMax-M2.5
      log-requests: true
      log-responses: true
      max-tokens: 8192
      max-retries: 0
      timeout: 180s

    streaming-chat-model:
      base-url: https://api.minimaxi.com/v1
      api-key: ${MUSE_MINIMAX_API_KEY}
      model-name: MiniMax-M2.5
      log-requests: true
      log-responses: true
      max-tokens: 8192
      timeout: 180s
      strict-json-schema: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: cn.edu.sxu.museai.controller

server:
  port: 7779
  servlet:
    context-path: /api
# MinIO配置
minio:
  endpoint: http://106.54.215.151:9000
  access-key: root
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: muse-ai

# 阿里云 DashScope 配置
dashscope:
  api-key: ${ALIYUN_AI_KEY}
  image-model: wan2.2-t2i-flash

minimax:
  base-url: https://api.minimaxi.com/v1
  api-key: ${MUSE_MINIMAX_API_KEY}
  model-name: MiniMax-M2.5
  log-request: true
  log-response: true
  max-tokens: 8192

glm:
  base-url: https://open.bigmodel.cn/api/paas/v4/
  api-key: ${GLM_KEY}
  model-name: GLM-4.7-FlashX
  log-request: true
  log-response: true
  max-tokens: 8192

qwen:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${ALIYUN_AI_KEY}
  model-name: qwen-turbo
  log-request: true
  log-response: true
  max-tokens: 128

dubbo:
  application:
    qos-enable: false
  registry:
    address: nacos://106.54.215.151:8848
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 60000
  provider:
    timeout: 60000
