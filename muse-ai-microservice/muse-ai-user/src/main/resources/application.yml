spring:
  application:
    name: muse-ai-user
  # session
  session:
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://106.54.215.151:3306/muse_ai
    username: root
    password: ${MYSQL_PASSWORD}
  # redis
  data:
    redis:
      host: 106.54.215.151
      port: 6380
      database: 0
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: 106.54.215.151:8848
        namespace: 47f6fb31-1206-4a12-9dfb-e595de064aed
server:
  port: 7778
  servlet:
    context-path: /api
    # 30 days expire
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: cn.edu.sxu.museai.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
dubbo:
  registry:
    address: nacos://106.54.215.151:8848
    register-mode: instance
  protocol:
    name: tri
    port: 50051

  consumer:
    timeout: 60000
  provider:
    timeout: 60000

